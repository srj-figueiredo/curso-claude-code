<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador de WhatsApp: Patas Felizes</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; font-family: system-ui, sans-serif; background: #e5ddd5; }
  header { background: #075e54; color: #fff; padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  header h1 { font-size: 16px; margin: 0 8px 0 0; }
  header label { font-size: 12px; display: flex; flex-direction: column; gap: 2px; }
  header input { padding: 5px 6px; border: 0; border-radius: 4px; width: 180px; }
  #provedor { font-size: 12px; opacity: .85; }
  #aviso { display: none; padding: 6px 14px; background: #fff3cd; font-size: 13px; }
  #conversa { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
  .bolha { max-width: 72%; padding: 7px 10px; border-radius: 8px; white-space: pre-wrap; box-shadow: 0 1px 1px rgba(0,0,0,.15); font-size: 15px; line-height: 1.35; }
  .do-cliente { align-self: flex-end; background: #dcf8c6; }
  .do-atendente { align-self: flex-start; background: #fff; }
  .hora { font-size: 11px; color: #667; text-align: right; margin-top: 2px; }
  .sistema { align-self: center; font-size: 12px; background: rgba(255,255,255,.85); padding: 4px 10px; border-radius: 6px; }
  form { display: flex; gap: 8px; padding: 10px; background: #f0f0f0; }
  form input[type=text] { flex: 1; padding: 10px 14px; border: 1px solid #ccc; border-radius: 20px; font-size: 15px; }
  button { padding: 10px 16px; border: 0; border-radius: 20px; background: #075e54; color: #fff; cursor: pointer; font-size: 14px; }
  button.secundario { background: #667781; }
</style>
</head>
<body>
<header>
  <h1>Patas Felizes · WhatsApp (simulador)</h1>
  <label>Telefone do cliente (só números)<input id="telefone" value="5511999990001"></label>
  <label>Nome<input id="nome" value="Cliente teste"></label>
  <span id="provedor"></span>
</header>
<div id="aviso"></div>
<main id="conversa"></main>
<form id="formulario">
  <input id="texto" type="text" placeholder="Digite como se fosse o cliente" autocomplete="off">
  <button type="submit">Enviar</button>
  <button type="button" id="audio" class="secundario">Enviar áudio</button>
</form>
<script>
  const $ = (seletor) => document.querySelector(seletor);
  const telefoneValido = () => /^\d{5,20}$/.test($('#telefone').value.trim());

  function aviso(mensagem) {
    $('#aviso').textContent = mensagem;
    $('#aviso').style.display = mensagem ? 'block' : 'none';
  }

  function sistema(mensagem) {
    const div = document.createElement('div');
    div.className = 'sistema';
    div.textContent = mensagem;
    $('#conversa').appendChild(div);
  }

  function bolha(m) {
    const div = document.createElement('div');
    div.className = 'bolha ' + (m.direcao === 'entrada' ? 'do-cliente' : 'do-atendente');
    div.textContent = m.texto ?? `[${m.tipo} sem texto]`;
    const hora = document.createElement('div');
    hora.className = 'hora';
    const quando = new Date(m.criado_em).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    hora.textContent = (m.autor === 'bot' ? 'atendente virtual · ' : '') + quando;
    div.appendChild(hora);
    $('#conversa').appendChild(div);
  }

  async function carregar() {
    if (!telefoneValido()) return aviso('O telefone deve ter de 5 a 20 números, sem espaços.');
    aviso('');
    const resposta = await fetch('/api/conversa?telefone=' + $('#telefone').value.trim());
    const dados = await resposta.json();
    $('#conversa').replaceChildren();
    dados.mensagens.forEach(bolha);
    if (dados.conversa && dados.conversa.status === 'com_pessoa') {
      sistema(`Passou para a equipe (${dados.conversa.motivo_repasse}). O atendente não responde mais nesta conversa.`);
    }
    if (dados.cliente && dados.cliente.parou) {
      sistema('O cliente escreveu "parar". Nenhuma mensagem é enviada a ele.');
    }
    $('#conversa').scrollTop = $('#conversa').scrollHeight;
  }

  function montarPayload(texto, tipo) {
    const de = $('#telefone').value.trim();
    const mensagem = {
      from: de,
      id: 'wamid.SIM' + Date.now() + Math.floor(Math.random() * 1000),
      timestamp: String(Math.floor(Date.now() / 1000)),
      type: tipo,
    };
    if (tipo === 'text') mensagem.text = { body: texto };
    else mensagem[tipo] = { id: 'simulado' };
    return {
      object: 'whatsapp_business_account',
      entry: [{
        id: 'SIMULADOR',
        changes: [{
          field: 'messages',
          value: {
            messaging_product: 'whatsapp',
            metadata: { display_phone_number: '5511900000000', phone_number_id: 'SIMULADOR' },
            contacts: [{ profile: { name: $('#nome').value.trim() || 'Cliente' }, wa_id: de }],
            messages: [mensagem],
          },
        }],
      }],
    };
  }

  async function enviar(texto, tipo) {
    if (!telefoneValido()) return aviso('O telefone deve ter de 5 a 20 números, sem espaços.');
    const resposta = await fetch('/webhook', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(montarPayload(texto, tipo)),
    });
    if (!resposta.ok) aviso(`O webhook respondeu ${resposta.status}.`);
    await carregar();
  }

  $('#formulario').addEventListener('submit', (evento) => {
    evento.preventDefault();
    const texto = $('#texto').value.trim();
    if (!texto) return;
    $('#texto').value = '';
    enviar(texto, 'text');
  });
  $('#audio').addEventListener('click', () => enviar('', 'audio'));
  $('#telefone').addEventListener('change', carregar);

  fetch('/api/info').then((r) => r.json()).then((d) => { $('#provedor').textContent = 'provedor: ' + d.provedor; });
  carregar();
</script>
</body>
</html>
